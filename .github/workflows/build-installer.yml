name: Build native packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            jpackage_type: msi
          - os: ubuntu-latest
            platform: linux
            jpackage_type: app-image

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25 (Temurin ships jpackage + jlink)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Linux packaging prerequisites
        if: matrix.platform == 'linux'
        run: |
          chmod +x gradlew

      # windows-latest bundles WiX Toolset 3.14.x, which is the version
      # jpackage's msi/exe bundler actually works with today -- WiX 5/6 are
      # still broken with jpackage as of JDK 25 (see JDK-8356592). Don't add
      # a `dotnet tool install wix` step here, it would pull WiX 5/6 and
      # break the build.

      - name: Build fat jar (this OS's JavaFX natives get baked in)
        run: ./gradlew customFatJar --no-daemon
        shell: bash

      - name: Resolve app version
        id: appver
        run: |
          VERSION=$(./gradlew -q printAppVersion --no-daemon)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Stage jar for jpackage
        run: |
          mkdir -p dist-input
          cp build/libs/ValDB.jar dist-input/
        shell: bash

      - name: jpackage (Windows -> msi)
        if: matrix.platform == 'windows'
        run: >
          jpackage
          --input dist-input
          --dest dist
          --name ValDB
          --app-version ${{ steps.appver.outputs.version }}
          --main-jar ValDB.jar
          --main-class ch.muhmenthaler.valdb.Launcher
          --type msi
          --win-per-user-install
          --win-dir-chooser
          --win-menu
          --win-shortcut
          --win-shortcut-prompt

      - name: jpackage (Linux -> app-image)
        if: matrix.platform == 'linux'
        run: >
          jpackage
          --input dist-input
          --dest dist
          --name ValDB
          --app-version ${{ steps.appver.outputs.version }}
          --main-jar ValDB.jar
          --main-class ch.muhmenthaler.valdb.Launcher
          --type app-image

      - name: Package Linux app-image for distribution
        if: matrix.platform == 'linux'
        run: |
          cd dist
          zip -r ValDB-linux.zip ValDB
          rm -rf ValDB
        shell: bash

      - name: Upload workflow-run artifact
        uses: actions/upload-artifact@v4
        with:
          name: ValDB-${{ matrix.platform }}
          path: dist/*

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}